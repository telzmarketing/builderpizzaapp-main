name: Gran Torino Print Service
on:
  workflow_dispatch:
  push:
    paths:
      - 'print-service/**'
      - '.github/workflows/print-service-build.yml'
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: print-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y --force
      - name: Locate Inno Setup compiler
        shell: powershell
        run: |
          $chocoRoot = if ($env:ChocolateyInstall) { $env:ChocolateyInstall } else { 'C:\ProgramData\chocolatey' }
          $searchRoots = @(
            "$chocoRoot\bin",
            "$chocoRoot\lib\innosetup",
            "$chocoRoot\lib\InnoSetup",
            'C:\ProgramData\chocolatey\bin',
            'C:\Program Files (x86)\Inno Setup 6',
            'C:\Program Files\Inno Setup 6'
          ) | Where-Object { $_ -and (Test-Path -LiteralPath $_ -PathType Container) } | Select-Object -Unique

          Write-Host 'Inno Setup discovery roots:'
          $searchRoots | ForEach-Object { Write-Host "  $_" }

          $pathCandidates = @(
            (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Path,
            (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          ) | Where-Object { $_ -and (Test-Path -LiteralPath $_ -PathType Leaf) }
          $recursiveCandidates = @(foreach ($root in $searchRoots) {
            Get-ChildItem -LiteralPath $root -Filter ISCC.exe -File -Recurse -Force -ErrorAction SilentlyContinue
          }) | Select-Object -ExpandProperty FullName
          $candidates = @($pathCandidates) + @($recursiveCandidates) | Select-Object -Unique
          $iscc = $candidates | Select-Object -First 1

          Write-Host 'ISCC.exe candidates found:'
          if ($candidates) { $candidates | ForEach-Object { Write-Host "  $_" } }
          if (-not $iscc) {
            Write-Host 'PATH:'
            $env:Path -split ';' | Where-Object { $_ } | ForEach-Object { Write-Host "  $_" }
            Write-Host 'Chocolatey package diagnostics:'
            choco list --local-only --exact innosetup --limit-output
            Get-ChildItem -LiteralPath "$chocoRoot\lib" -Directory -Filter '*inno*' -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.FullName)" }
            throw 'ISCC.exe nao encontrado apos instalar o Inno Setup.'
          }
          $iscc = (Resolve-Path -LiteralPath $iscc).Path
          "ISCC_PATH=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "ISCC_PATH=$iscc"
          & $iscc /? | Select-Object -First 8
      - name: Publish and package
        shell: powershell
        run: ./scripts/build.ps1
      - name: Generate checksums
        shell: powershell
        run: |
          $artifacts = [IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE 'print-service/artifacts'))
          $installer = Join-Path $artifacts 'GranTorinoPrintService-Setup.exe'
          if (-not (Test-Path -LiteralPath $artifacts -PathType Container)) { throw "artifacts nao foi criado: $artifacts" }
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) { throw "Instalador ausente antes dos checksums: $installer" }
          if ((Get-Item -LiteralPath $installer).Length -le 0) { throw "Instalador vazio: $installer" }
          $files = Get-ChildItem -LiteralPath $artifacts -File | Where-Object Name -ne 'SHA256SUMS.json'
          if (-not $files) { throw "Nenhum artefato encontrado em $artifacts." }
          $files | Get-FileHash -Algorithm SHA256 | ConvertTo-Json | Out-File (Join-Path $artifacts 'SHA256SUMS.json') -Encoding utf8
          Get-ChildItem -LiteralPath $artifacts -File | Select-Object FullName, Length
      - uses: actions/upload-artifact@v4
        with:
          name: GranTorinoPrintService-win-x64
          path: print-service/artifacts/*
          if-no-files-found: error
